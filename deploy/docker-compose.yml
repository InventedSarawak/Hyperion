# Local development infrastructure for Hyperion.
# Bring up with:  task infra:up   (or: docker compose -f deploy/docker-compose.yml up -d)
name: hyperion

services:
  postgres:
    image: postgres:17
    container_name: hyperion-postgres
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: hyperion
      POSTGRES_DB: hyperion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperion -d hyperion"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: hyperion-elasticsearch
    environment:
      # Single-node dev cluster with security off: local only, never production.
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26
    container_name: hyperion-neo4j
    environment:
      # Single-instance dev graph. Community edition, one database ("neo4j").
      NEO4J_AUTH: neo4j/hyperion
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (the driver speaks this)
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell ships in the image; an HTTP probe would only prove the
      # browser is up, not that Bolt will accept a session.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p hyperion 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  elasticsearch_data:
  neo4j_data:
