# Local development infrastructure for Hyperion.
# Bring up with:  docker compose -f deploy/docker-compose.yml up -d
name: hyperion

services:
  postgres:
    image: postgres:17
    container_name: hyperion-postgres
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: hyperion
      POSTGRES_DB: hyperion
    # Host port 5433 (5432 is often taken by a local Postgres); container stays 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperion -d hyperion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
