# Local development infrastructure for Hyperion.
# Bring up with:  task infra:up   (or: docker compose -f deploy/docker-compose.yml up -d)
name: hyperion

services:
  postgres:
    image: postgres:17
    container_name: hyperion-postgres
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: hyperion
      POSTGRES_DB: hyperion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperion -d hyperion"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: hyperion-elasticsearch
    environment:
      # Single-node dev cluster with security off: local only, never production.
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26
    container_name: hyperion-neo4j
    environment:
      # Single-instance dev graph. Community edition, one database ("neo4j").
      NEO4J_AUTH: neo4j/hyperion
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (the driver speaks this)
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell ships in the image; an HTTP probe would only prove the
      # browser is up, not that Bolt will accept a session.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p hyperion 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hyperion-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: hyperion-kafka
    environment:
      # Single-node KRaft: this one process is both the broker and the
      # controller quorum. ZooKeeper is gone as of Kafka 4.0 — there is no
      # second container to run any more.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three listeners, because "where is the broker" has three different
      # answers here: the host (Go services run natively — see Rule 7 debt),
      # another container (once they are containerised in v4), and the
      # controller's own internal traffic. A client is told to reconnect to
      # the ADVERTISED address, so a single listener would be reachable from
      # exactly one of those places.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # One broker, so nothing can be replicated anywhere: every replication
      # factor must be 1 or the internal topics never come up.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # A lone consumer should not wait out the 3s rebalance window on every
      # start; local dev wants the group formed immediately.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Retention is a laptop disk, not a data lake: a ten-year backfill is
      # hundreds of thousands of records. relic (v4) owns cold storage.
      KAFKA_LOG_RETENTION_HOURS: 168
      # A long advisory (hundreds of references, a few thousand words of
      # description) exceeds Kafka's 1MiB default. Matches
      # kafka.MaxRecordBytes in packages/common/kafka.
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Listing topics proves the broker is accepting API calls, not merely
      # that something is bound to the port.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # A GUI for the event backbone: topics, messages (decoded), consumer groups
  # and lag. Read-only in practice and local-dev only — like everything else
  # here, it has no authentication in front of it.
  #
  # Named kafka-console, not console: `console` is already Hyperion's Next.js
  # dashboard, and two things called console in one repo is one too many.
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: hyperion-kafka-console
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/hyperion/console.yaml
    ports:
      # 8080 inside, 8081 outside: nexus already holds 8080 on the host.
      - "8081:8080"
    volumes:
      - ./kafka-console.yaml:/etc/hyperion/console.yaml:ro
      - ../packages/contracts/proto:/etc/hyperion/proto:ro

  # ---------------------------------------------------------------------------
  # Hyperion's own services, containerised (AGENTS.md Rule 7).
  #
  # Behind the "apps" profile, so `task up` — infrastructure in containers, the
  # Go services native for a one-second rebuild — is unchanged, and the
  # containerised stack is asked for explicitly: `task up:containers`. The two
  # bind the same host ports and cannot run side by side.
  #
  # Every image is built from deploy/docker/go-service.Dockerfile: static
  # binaries on distroless, nonroot, no shell. Addresses point at the compose
  # network (postgres:5432, kafka:29092 …) and are set here, after .env, so a
  # .env written for the native loop — localhost everywhere — cannot send a
  # container looking for a database inside itself. .env still supplies the
  # secrets: API tokens and keys.
  # ---------------------------------------------------------------------------

  cortex:
    profiles: [apps]
    image: hyperion/cortex:dev
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { APP: cortex, CMD: server }
    container_name: hyperion-cortex
    # A ceiling against a runaway, not a budget: idle is ~20 MiB, and peaks
    # (a backfill, an OSV bulk parse) are not measured yet. Generous on
    # purpose — an out-of-memory kill mid-ingest is worse than the host
    # running a little warm.
    mem_limit: 1g
    env_file:
      - path: ../.env
        required: false
    environment:
      CORTEX_DATABASE_URL: postgres://hyperion:hyperion@postgres:5432/hyperion?sslmode=disable
      CORTEX_ELASTICSEARCH_URL: http://elasticsearch:9200
      CORTEX_NEO4J_URI: bolt://neo4j:7687
      CORTEX_REDIS_ADDR: redis:6379
      CORTEX_KAFKA_BROKERS: kafka:29092
      CORTEX_GRPC_ADDR: ":50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      # grpc.health.v1: SERVING only while Postgres answers. Elasticsearch or
      # Neo4j being down leaves it serving on purpose — ingest carries on
      # without them, and a restart would turn degraded into stopped.
      test: ["CMD", "/probe", "grpc", "127.0.0.1:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Migrations, the index alias and the alert rule index all settle
      # before cortex first reports serving.
      start_period: 60s

  nexus:
    profiles: [apps]
    image: hyperion/nexus:dev
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { APP: nexus, CMD: server }
    container_name: hyperion-nexus
    # A ceiling against a runaway, not a budget: idle is ~20 MiB, and peaks
    # (a backfill, an OSV bulk parse) are not measured yet. Generous on
    # purpose — an out-of-memory kill mid-ingest is worse than the host
    # running a little warm.
    mem_limit: 256m
    env_file:
      - path: ../.env
        required: false
    environment:
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_CORTEX_GRPC_ADDR: cortex:50051
    ports:
      - "8080:8080"
    depends_on:
      cortex: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      # Unhealthy whenever cortex is: a gateway that cannot reach the service
      # behind it should not be sent traffic it will fail.
      test: ["CMD", "/probe", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  siphon:
    profiles: [apps]
    image: hyperion/siphon:dev
    build:
      context: ..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { APP: siphon, CMD: worker }
    container_name: hyperion-siphon
    # A ceiling against a runaway, not a budget: idle is ~20 MiB, and peaks
    # (a backfill, an OSV bulk parse) are not measured yet. Generous on
    # purpose — an out-of-memory kill mid-ingest is worse than the host
    # running a little warm.
    mem_limit: 1g
    env_file:
      - path: ../.env
        required: false
    environment:
      SIPHON_KAFKA_BROKERS: kafka:29092
      SIPHON_REDIS_ADDR: redis:6379
      SIPHON_CORTEX_GRPC_ADDR: cortex:50051
      SIPHON_HEALTH_ADDR: ":8082"
    ports:
      - "8082:8082"
    # Not on cortex: siphon publishes to Kafka, and keeps publishing while
    # cortex is down. That independence is what the broker was for.
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      # Its required check is the poll heartbeat: a wedged worker answers a
      # port probe as happily as a working one.
      test: ["CMD", "/probe", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first poll across ten feeds takes a while; it is unhealthy until
      # that poll has started.
      start_period: 60s

volumes:
  postgres_data:
  elasticsearch_data:
  neo4j_data:
  kafka_data:
