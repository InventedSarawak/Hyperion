version: '3'

vars:
  # Space-separated (not newline) so it expands cleanly into a shell `for … in` list.
  GO_APPS:
    sh: find apps -maxdepth 2 -name "go.mod" -exec dirname {} \; | sed 's|^\./||' | tr '\n' ' '

tasks:
  default:
    cmds:
      - task: status

  up:
    desc: Start the whole system (infra + cortex + nexus)
    cmds:
      - ./scripts/system.sh up

  down:
    desc: Stop the whole system (services, then infra)
    cmds:
      - ./scripts/system.sh down

  restart:
    desc: Rebuild and restart cortex, nexus and ingest after a code change (infra keeps running)
    cmds:
      - ./scripts/system.sh restart

  status:
    desc: Show what is running, with health and data counts
    cmds:
      - ./scripts/system.sh status

  logs:
    desc: Tail the running service logs
    cmds:
      - ./scripts/system.sh logs

  sources:check:
    desc: Probe every ingestion source once and report which are working
    dir: apps/siphon
    cmds:
      - go run ./cmd/worker -check-sources {{.CLI_ARGS}}

  dev:frontend:
    desc: Start the Next.js console in dev mode
    cmds:
      - pnpm run dev

  build:
    desc: Build everything using TurboRepo
    cmds:
      - pnpm run build

  build:go:
    desc: Compile all Go microservices (compile-check; no binaries until services have a real func main)
    cmds:
      - |
        set -e
        for app in {{.GO_APPS}}; do
          echo "Building $app..."
          (cd "$app" && go build ./...)
        done

  infra:up:
    desc: Start local infrastructure (Postgres, Elasticsearch, Neo4j) via docker compose
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d

  infra:down:
    desc: Stop local infrastructure (add -- -v to also drop volumes)
    cmds:
      - docker compose -f deploy/docker-compose.yml down {{.CLI_ARGS}}

  run:siphon:
    desc: Run the ingestion worker (events to stdout, logs to stderr)
    dir: apps/siphon
    cmds:
      - go run ./cmd/worker

  run:cortex:
    desc: Run the intelligence service (gRPC search API)
    dir: apps/cortex
    cmds:
      - go run ./cmd/server

  run:deck:
    desc: Run the terminal UI (needs cortex on :50051)
    dir: apps/deck
    cmds:
      - go run ./cmd/tui

  run:nexus:
    desc: Run the API gateway (GraphQL at :8080/graphql, console at /playground)
    dir: apps/nexus
    cmds:
      - go run ./cmd/server

  scan:
    desc: 'Scan every tracked repository now (needs cortex). One-off: task scan -- -repos owner/name | -orgs vercel'
    dir: apps/siphon
    cmds:
      - go run ./cmd/worker -scan-repos {{.CLI_ARGS}}

  blast:
    desc: 'Blast radius for a CVE: task blast -- CVE-2021-44228 (needs cortex + grpcurl)'
    cmds:
      - |
        grpcurl -plaintext -d "{\"cve_id\":\"{{.CLI_ARGS}}\",\"max_depth\":5}" \
          localhost:50051 hyperion.intelligence.v1.IntelligenceService/GetBlastRadius

  reindex:
    desc: Rebuild the search index from Postgres (after a mapping change, or to repair drift)
    dir: apps/cortex
    cmds:
      - go run ./cmd/server -reindex

  subscribe:
    desc: 'Create an alert rule: task subscribe -- ''{"name":"Log4j","rule":{"term":"log4j"}}'''''
    cmds:
      - |
        grpcurl -plaintext -d '{{.CLI_ARGS}}' \
          localhost:50051 hyperion.alerting.v1.AlertingService/CreateSubscription

  alerts:
    desc: Show the alerts raised so far (needs cortex + grpcurl)
    cmds:
      - |
        grpcurl -plaintext -d '{"limit":20}' \
          localhost:50051 hyperion.alerting.v1.AlertingService/ListAlerts

  backfill:
    desc: 'Load history into cortex: NVD + OSV exports since a date (default 10 years). Override: task backfill -- -backfill-from 2019-01-01 -backfill-sources osv'
    cmds:
      - |
        set -e
        cd apps/siphon && go run ./cmd/worker -backfill {{.CLI_ARGS}} | \
          (cd ../cortex && CORTEX_CONSUME_STDIN=true go run ./cmd/server)

  ingest:
    desc: Pipe one siphon poll straight into cortex (siphon | cortex)
    cmds:
      - |
        set -e
        cd apps/siphon && go run ./cmd/worker 2>/dev/null | \
          (cd ../cortex && CORTEX_CONSUME_STDIN=true go run ./cmd/server)

  test:go:integration:
    desc: Run Go tests including the Postgres/Elasticsearch/Neo4j/Redis integration suites
    env:
      CORTEX_TEST_DATABASE_URL: postgres://hyperion:hyperion@localhost:5432/hyperion?sslmode=disable
      CORTEX_TEST_ELASTICSEARCH_URL: http://localhost:9200
      CORTEX_TEST_NEO4J_URI: bolt://localhost:7687
      CORTEX_TEST_REDIS_ADDR: localhost:6379
    cmds:
      - ./scripts/test-go-files.sh

  test:all:
    desc: Every level of test, in order — unit, integration, then black-box against a running stack
    cmds:
      - task: test:go:integration
      - task: test:e2e

  test:e2e:
    desc: 'Black-box end-to-end tests against a running stack (task up first)'
    dir: tests/e2e
    env:
      HYPERION_E2E_CORTEX_ADDR: localhost:50051
      HYPERION_E2E_NEXUS_URL: http://localhost:8080/graphql
    cmds:
      - go test ./... {{.CLI_ARGS}}

  codegen:
    desc: Generate Go code from protobuf contracts (buf + local protoc-gen plugins)
    dir: packages/contracts
    cmds:
      - buf lint
      - buf generate
      - go mod tidy

  tidy:
    desc: Run go mod tidy across all Go microservices
    cmds:
      - ./scripts/tidy-go-files.sh

  test:go:
    desc: Run Go tests across all workspace modules
    cmds:
      - ./scripts/test-go-files.sh

  test:go:rich:
    desc: Run Go tests across all workspace modules with RichGo output
    cmds:
      - GO_TEST_RUNNER="richgo test" ./scripts/test-go-files.sh
    
