syntax = "proto3";

package hyperion.alerting.v1;

import "google/protobuf/timestamp.proto";
import "hyperion/common/v1/package.proto";
import "hyperion/common/v1/vulnerability.proto";

// AlertingService is cortex's alert rule and alert API. A user describes what
// they want to hear about once; every incoming vulnerability is matched against
// every rule (reverse search), so nobody has to poll.
//
// These were called subscriptions until billing made that word mean something
// else: an alert rule is a standing request to be told, not a thing anyone pays
// for.
service AlertingService {
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (CreateAlertRuleResponse);
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse);
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse);
  // ListAlerts returns what has already matched, newest first.
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
}

// AlertCriteria is what a rule matches. Every populated condition must hold,
// so conditions narrow rather than widen. Criteria with no conditions at all
// are rejected: they would match every vulnerability ever ingested, which is
// the alert fatigue this platform exists to prevent.
message AlertCriteria {
  string term = 1; // free text over cve id, title and description
  hyperion.common.v1.Severity min_severity = 2; // UNSPECIFIED = any severity
  // Match when the vulnerability affects any of these libraries. Version is
  // ignored: a rule tracks a library, not a pin.
  repeated hyperion.common.v1.PackageRef packages = 3;
  repeated hyperion.common.v1.Ecosystem ecosystems = 4;
}

// AlertRule is one user's standing interest.
message AlertRule {
  string id = 1;
  string tenant = 2; // owner; per-tenant isolation arrives with auth in v4
  string name = 3;
  AlertCriteria criteria = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Alert is one vulnerability matching one rule.
message Alert {
  string id = 1;
  string rule_id = 2;
  string rule_name = 3;
  string tenant = 4;
  string cve_id = 5;
  // The matching vulnerability, resolved on read. Alerts store only the CVE
  // id, so a later correction to the record is reflected rather than frozen.
  hyperion.common.v1.Vulnerability vulnerability = 6;
  string reason = 7; // which conditions matched, for display
  google.protobuf.Timestamp created_at = 8;
}

message CreateAlertRuleRequest {
  string tenant = 1;
  string name = 2;
  AlertCriteria criteria = 3;
}

message CreateAlertRuleResponse {
  AlertRule rule = 1;
}

message ListAlertRulesRequest {
  string tenant = 1; // empty lists every tenant's, until auth scopes it (v4)
}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

message DeleteAlertRuleRequest {
  string id = 1;
}

message DeleteAlertRuleResponse {
  bool deleted = 1;
}

message ListAlertsRequest {
  string tenant = 1;
  string rule_id = 2; // optional filter
  int32 limit = 3;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}
