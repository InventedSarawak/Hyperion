syntax = "proto3";

package hyperion.common.v1;

// ExposureVerdict says whether a repository is exposed to a finding, judged by
// comparing the version the repository declares with the versions the
// advisory says are affected. A declared range (npm's "^5.11.0") is judged
// against every version it allows, because without a lockfile the installed
// one is unknown.
enum ExposureVerdict {
  EXPOSURE_VERDICT_UNSPECIFIED = 0;
  // Every version the declaration allows is affected.
  EXPOSURE_VERDICT_AFFECTED = 1;
  // Some allowed versions are affected; the installed one decides.
  EXPOSURE_VERDICT_POSSIBLY_AFFECTED = 2;
  // No allowed version is affected.
  EXPOSURE_VERDICT_NOT_AFFECTED = 3;
  // One side could not be read: a dist-tag, a git URL, an unusual range.
  EXPOSURE_VERDICT_UNKNOWN = 4;
}

// ExposureSummary counts the serious findings a repository may be exposed
// to, so it can be flagged before anyone opens it. Each finding is counted
// once, at its worst verdict; malware counts as critical, and an unknown
// verdict counts as possible, since it cannot be ruled out.
message ExposureSummary {
  // False when the dependency graph could not be asked: the counts then mean
  // "unknown", never "nothing found".
  bool computed = 1;
  int32 critical_affected = 2;
  int32 critical_possible = 3;
  int32 high_affected = 4;
  int32 high_possible = 5;
  // Every finding the repository may be exposed to, whatever its severity.
  int32 total = 6;
}
