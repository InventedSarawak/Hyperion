syntax = "proto3";

package hyperion.events.v1;

import "google/protobuf/timestamp.proto";
import "hyperion/common/v1/package.proto";
import "hyperion/common/v1/repository.proto";
import "hyperion/common/v1/vulnerability.proto";

// SourceKind identifies the upstream feed a signal originated from.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_NVD = 1;
  SOURCE_KIND_GITHUB_ADVISORY = 2;
  SOURCE_KIND_CISA_KEV = 3;
  SOURCE_KIND_EXPLOIT_DB = 4;
  SOURCE_KIND_MITRE = 5;
  SOURCE_KIND_VENDOR_ADVISORY = 6;
  SOURCE_KIND_OSINT = 7;
  SOURCE_KIND_PACKAGE_FEED = 8;
  SOURCE_KIND_SHODAN = 9;
  SOURCE_KIND_GSD = 10;
}

// SignalDiscovered is emitted by siphon when it observes a vulnerability
// signal from an upstream source. This is the event contract that cortex
// consumes off the message bus (topic: raw-signals).
message SignalDiscovered {
  string signal_id = 1; // stable dedupe / idempotency key
  SourceKind source = 2;
  hyperion.common.v1.Vulnerability vulnerability = 3;
  google.protobuf.Timestamp discovered_at = 4;
  string raw_ref = 5; // pointer to the archived raw payload (e.g. object key)
}

// DependencyObserved is emitted by siphon when it reads a repository's
// dependency manifests. cortex consumes it and writes the graph edges.
//
// It carries an observation rather than a command: siphon reports what a
// manifest said, and what the graph does about it is cortex's business. That
// is the difference from the IngestDependencies RPC it replaces — a scan no
// longer fails because cortex is restarting, and a scan that happens while
// cortex is down is replayed rather than lost.
message DependencyObserved {
  // observation_id is a stable dedupe key for one read of one repository.
  string observation_id = 1;
  hyperion.common.v1.Repository repository = 2;
  hyperion.common.v1.Author author = 3;
  // publishes is the library the repository itself ships, when its manifest
  // names one — this is what makes the graph transitive.
  hyperion.common.v1.PackageRef publishes = 4;
  repeated hyperion.common.v1.Dependency dependencies = 5;
  google.protobuf.Timestamp observed_at = 6;
}
