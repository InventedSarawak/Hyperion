# What the pre-commit hook checks, checked somewhere other than one laptop.
#
# The hook (.husky/pre-commit) is the fast loop and stays the fast loop; this
# is the same set of checks run where they cannot be skipped with --no-verify,
# on a machine nobody has configured by hand. The two are deliberately the same
# commands — `task build:go`, `task test:go` — so that a green hook and a green
# pipeline mean the same thing.
#
# Only first-party actions plus `go install`. A CI pipeline for a security tool
# that pulls a dozen third-party actions into its own supply chain is not an
# argument anyone wants to have to make.
name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUF_VERSION: v1.72.0
  TASK_VERSION: v3.53.1
  GRPCURL_VERSION: v1.9.3
  # husky installs git hooks on `pnpm install`. There is nothing to hook here,
  # and this pipeline exists precisely because hooks can be skipped.
  HUSKY: 0

jobs:
  # Everything that needs no infrastructure and no compiled binary. Fails in
  # under a minute, which is where most mistakes are caught.
  static:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # corepack after setup-node, so the shim it writes belongs to the Node
      # this job will actually use. It reads the pnpm version out of
      # package.json's packageManager field.
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: prettier
        run: pnpm run format:check

      - name: gofmt
        run: |
          # Generated code is not ours to format.
          files=$(find apps packages tests -name '*.go' -not -path '*/gen/*')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these files need formatting (run: gofmt -w <file>)"
            echo "$unformatted"
            exit 1
          fi

      - name: eslint
        run: pnpm run lint

      - name: typescript
        run: pnpm run check-types

      - name: each module builds on its own
        # The workspace (go.work) fills in any dependency a module forgot to
        # require, so every local build passes — and the module is broken the
        # moment it is built alone, which is how a container builds it. siphon
        # and deck were, for a milestone, and only an image build noticed.
        run: |
          set -e
          for mod in apps/* packages/common packages/contracts; do
            [ -f "$mod/go.mod" ] || continue
            echo "standalone: $mod"
            (cd "$mod" && GOWORK=off go build ./...)
          done

      - name: go vet
        run: |
          set -e
          for mod in apps/* packages/common tests/e2e; do
            [ -f "$mod/go.mod" ] || continue
            echo "vetting $mod"
            (cd "$mod" && go vet ./...)
          done

  # Protobuf is the contract between every service. Generated code that has
  # drifted from the .proto files is a compile error waiting for whoever next
  # runs codegen, and it is invisible until then.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Install buf and the protoc plugins
        # The plugin versions are read from the stamp at the top of the
        # committed generated code, not pinned here. Each plugin writes its
        # version into what it generates, so a different version is drift by
        # construction; pinning them by hand once already guessed wrong (from
        # go.mod, which records the runtime library, not the plugin that
        # wrote the code). Regenerating with newer tools updates the stamp, and
        # this follows it.
        run: |
          stamp=packages/contracts/gen/hyperion/alerting/v1
          go_v=$(grep -m1 -oE 'protoc-gen-go v[0-9.]+' $stamp/alerting_service.pb.go | cut -d' ' -f2)
          grpc_v=v$(grep -m1 -oE 'protoc-gen-go-grpc v?[0-9.]+' $stamp/alerting_service_grpc.pb.go | grep -oE '[0-9.]+$')
          echo "plugins from the committed stamp: protoc-gen-go $go_v, protoc-gen-go-grpc $grpc_v"
          go install github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${go_v}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${grpc_v}

      - name: buf lint
        working-directory: packages/contracts
        run: buf lint

      - name: generated code is current
        working-directory: packages/contracts
        run: |
          buf generate
          if ! git diff --quiet -- gen; then
            echo "::error::generated code is stale — run 'task codegen' and commit the result"
            git diff --stat -- gen
            git diff -- gen | head -40
            exit 1
          fi

  # Unit and integration tests against the real Postgres, Elasticsearch, Neo4j,
  # Redis and Kafka, followed by the black-box tests against a running stack.
  #
  # Real backing services rather than fakes because that is what the suites are
  # for: the bugs worth catching here have been an Elasticsearch mapping
  # conflict, a Cypher constraint violation and a Postgres migration that read
  # the wrong schema — none of which a fake would have had an opinion about.
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Install grpcurl
        # So that waiting for cortex asks grpc.health.v1 whether it is serving
        # rather than whether the port is open. scripts/system.sh falls back to
        # a port probe without it, which would make this pipeline test the
        # weaker path of the two.
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@${GRPCURL_VERSION}

      - name: Start infrastructure
        # The same compose file the stack runs on locally. --wait holds until
        # every healthcheck passes, so a suite never races a cold Elasticsearch.
        # The Kafka console is a browser UI and no test wants it.
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait \
            postgres elasticsearch neo4j redis kafka

      - name: Build every service
        run: task build:go

      - name: Unit and integration tests
        run: task test:go:integration

      - name: Start the stack
        # Brings up cortex and nexus. It re-runs docker compose first, which is
        # idempotent — the containers above are already healthy, and it adds
        # only the Kafka console.
        #
        # HYPERION_INGEST=0 leaves siphon out: it would poll NVD, GitHub and
        # eight other feeds from a shared runner IP, with no API keys, and the
        # end-to-end tests do not need it to.
        run: HYPERION_INGEST=0 ./scripts/system.sh up

      - name: Seed the pipeline
        # The end-to-end specs assert against findings that exist; a fresh
        # runner has an empty store and the first one fails outright on it.
        #
        # Seeded by publishing synthetic findings to the real signal topic,
        # which is what tests/load documents as "drive the real pipeline". So
        # the seeding is itself a check of the path — broker to consumer to
        # Postgres and the search index — rather than a way around it. The ids
        # are CVE-9000-*, which nothing real will ever collide with.
        run: |
          task loadtest -- -topic hyperion.signals.v1 -no-consume -count 500 -rate 0

          # Published is not ingested. Wait for them to come back out of the
          # gateway, which is the first moment the whole path has run.
          for _ in $(seq 1 60); do
            total=$(./scripts/graphql.sh '{ search(sort: NEWEST, pageSize: 1) { totalResults } }' 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["search"]["totalResults"])' 2>/dev/null || echo 0)
            if [ "${total:-0}" -gt 0 ]; then
              echo "seeded: $total findings searchable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::published findings never became searchable — ingest is stuck"
          exit 1

      - name: End-to-end tests
        run: task test:e2e

      - name: Service logs
        if: failure()
        run: |
          ./scripts/system.sh status || true
          for log in .run/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done
          docker compose -f deploy/docker-compose.yml logs --tail 100

  # The services as they are deployed: built into their images and run from
  # them, then asked the same end-to-end questions as the native stack above.
  # Passing there and failing here means the image is wrong — a missing file,
  # a wrong address, a module that only built inside the workspace.
  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Build the images
        run: task images

      - name: Start cortex and nexus in containers
        # Their infrastructure comes up with them through depends_on, and
        # --wait holds until every healthcheck passes — the images' own
        # /probe, so this also proves the healthchecks work. siphon is left
        # out for the reason the tests job leaves it out: it would poll ten
        # public feeds from a shared runner with no API keys.
        run: docker compose -f deploy/docker-compose.yml --profile apps up -d --wait cortex nexus

      - name: Seed the pipeline
        # Into Kafka from the runner, out through the containerised cortex.
        run: |
          task loadtest -- -topic hyperion.signals.v1 -no-consume -count 500 -rate 0
          for _ in $(seq 1 60); do
            total=$(./scripts/graphql.sh '{ search(sort: NEWEST, pageSize: 1) { totalResults } }' 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["search"]["totalResults"])' 2>/dev/null || echo 0)
            if [ "${total:-0}" -gt 0 ]; then
              echo "seeded: $total findings searchable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::published findings never became searchable through the containers"
          exit 1

      - name: End-to-end tests against the containers
        run: task test:e2e

      - name: Container logs
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --profile apps ps
          docker compose -f deploy/docker-compose.yml --profile apps logs --tail 150 cortex nexus
